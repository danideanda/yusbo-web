<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error 404 - Página no encontrada</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #181818;
            font-family: Arial, sans-serif;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
        }

        .message-div {
            box-sizing: border-box;
            background-color: #333;
            width: 300px;
            min-height: 150px;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .text-p {
            color: #ddd;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <h1>404 - Página no encontrada</h1>

    <div class="message-div">
        <p class="text-p">
            La página que buscas no existe o ha sido movida.
        </p>
    </div>
</body>
</html>
